<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dual Manual Pro Controller</title>

<style>
  :root {
    --bg: #121417;
    --panel: #1c2026;
    --text: #e8eaed;
    --active: #ffcc4d;
    
    --white-top: #fdfdfd;
    --white-bottom: #dcdcdc;
    --black-top: #2a2a2a;
    --black-bottom: #111111;
  }

  * { box-sizing: border-box; }
  
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: none;
  }

  /* Maximize vertical space */
  .app-container { 
    display: flex; flex-direction: column; 
    height: 100dvh; padding: 4px; gap: 4px;
  }
  
  /* Compact Top Bar */
  header { 
    display: flex; align-items: center; gap: 6px; 
    background: var(--panel); padding: 4px 8px; 
    border-radius: 8px; flex-shrink: 0;
    border: 1px solid #31363d;
  }
  
  .spacer { flex-grow: 1; }
  
  .vol-control { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #a8b0ba; }
  input[type="range"] { width: 60px; accent-color: var(--active); }

  select, button { 
    background: #121417; color: var(--text); 
    border: 1px solid #444; border-radius: 6px; 
    padding: 4px 8px; font-size: 12px; font-weight: 600;
  }
  button { cursor: pointer; }
  button:active { background: #444; }
  .danger { background: #c62828; border-color: #c62828; color: white; }
  .danger:active { background: #9a1c1c; }

  /* Manuals */
  .manuals-container { display: flex; flex-direction: column; flex-grow: 1; gap: 4px; min-height: 0; }
  
  .manual { 
    background: var(--panel); border-radius: 8px; padding: 4px; 
    display: flex; flex-direction: column; flex: 1; min-height: 0;
    border: 1px solid #31363d;
  }
  
  /* Compact Manual Headers */
  .manual-header { 
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-shrink: 0; 
    padding: 0 4px;
  }
  .manual-title { font-weight: 700; font-size: 12px; color: #a8b0ba; margin-right: auto; }
  .header-controls { display: flex; gap: 8px; align-items: center; font-size: 11px; color: #a8b0ba; }
  .header-controls select { padding: 2px 4px; font-size: 11px; }
  
  /* The Piano */
  .keyboard { 
    position: relative; display: flex; flex-grow: 1; 
    border-radius: 6px; overflow: hidden; 
    user-select: none; touch-action: none; 
    background: #000;
    box-shadow: inset 0 5px 10px rgba(0,0,0,0.5);
  }
  
  .white-key { 
    flex: 1; 
    background: linear-gradient(to bottom, var(--white-top) 0%, var(--white-bottom) 100%);
    border-right: 1px solid #999; 
    border-bottom: 3px solid #bbb;
    position: relative; 
    border-radius: 0 0 4px 4px; 
    z-index: 1;
  }
  .white-key:last-child { border-right: none; }
  
  .black-key { 
    position: absolute; top: 0; 
    background: linear-gradient(to bottom, var(--black-top) 0%, var(--black-bottom) 100%);
    border-radius: 0 0 4px 4px; 
    border-bottom: 3px solid #000;
    z-index: 2; 
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.6); 
    pointer-events: auto; 
  }
  
  .white-key.active { 
    background: linear-gradient(to bottom, #ffebaa 0%, #ffcc4d 100%) !important; 
    border-bottom-color: #d4a32e;
  }
  .black-key.active { 
    background: linear-gradient(to bottom, #d4a32e 0%, #ffcc4d 100%) !important;
    border-bottom-color: #997317;
  }
  
  .key-label { 
    position: absolute; bottom: 6px; left: 50%; 
    transform: translateX(-50%); font-size: 10px; 
    color: #888; pointer-events: none; font-weight: 600;
  }
  .key-label:not(.show-label) { display: none; }
  
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="vol-control">
      <span>🔊</span>
      <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.3">
    </div>
    
    <div class="spacer"></div>

    <select id="midiOut"><option value="">None</option></select>
    <button id="connect">Connect</button>
    <button id="refresh" title="Refresh MIDI Ports">🔄</button>
    <button id="panic" class="danger">Panic</button>
  </header>

  <div class="manuals-container">
    <section class="manual" id="lowerManual">
      <div class="manual-header">
        <div class="manual-title">LOWER</div>
        <div class="header-controls">
          <label>Oct <select class="octave"><option value="-1">-1</option><option value="0" selected>0</option><option value="1">+1</option></select></label>
          <label>Ch <select class="channel"><option value="0" selected>1</option></select></label>
        </div>
      </div>
      <div class="keyboard" data-manual="0"></div>
    </section>

    <section class="manual" id="upperManual">
      <div class="manual-header">
        <div class="manual-title">UPPER</div>
        <div class="header-controls">
          <label>Oct <select class="octave"><option value="0">0</option><option value="1" selected>+1</option><option value="2">+2</option></select></label>
          <label>Ch <select class="channel"><option value="1" selected>2</option></select></label>
        </div>
      </div>
      <div class="keyboard" data-manual="1"></div>
    </section>
  </div>
</div>

<script>
// ==========================================
// 1. LOCAL SYNTH ENGINE
// ==========================================
let audioCtx = null;
let masterGain = null;
const activeVoices = new Map(); 

document.getElementById('volSlider').addEventListener('input', e => {
  if (masterGain) masterGain.gain.value = Number(e.target.value);
});

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = Number(document.getElementById('volSlider').value);
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSynthNote(midiNote, velocity) {
  initAudio();
  if (activeVoices.has(midiNote)) stopSynthNote(midiNote);

  const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc1.type = 'triangle';
  osc2.type = 'sine';
  osc1.frequency.value = freq;
  osc2.frequency.value = freq * 2; 

  const now = audioCtx.currentTime;
  const peakVol = (velocity / 127) * 0.8;

  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(peakVol, now + 0.02);

  osc1.connect(gain);
  osc2.connect(gain);
  gain.connect(masterGain);

  osc1.start(now);
  osc2.start(now);

  activeVoices.set(midiNote, { osc1, osc2, gain });
}

function stopSynthNote(midiNote) {
  if (!activeVoices.has(midiNote) || !audioCtx) return;
  
  const voice = activeVoices.get(midiNote);
  const now = audioCtx.currentTime;
  
  voice.gain.gain.cancelScheduledValues(now);
  voice.gain.gain.setValueAtTime(voice.gain.gain.value, now);
  voice.gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
  
  voice.osc1.stop(now + 0.35);
  voice.osc2.stop(now + 0.35);
  activeVoices.delete(midiNote);
}

// ==========================================
// 2. MIDI & KEYBOARD LOGIC
// ==========================================
const NUM_KEYS = 37; 
const BLACK_SEMITONES = [1, 3, 6, 8, 10];
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

let midiAccess = null;
let selectedOutput = null;
const activePointers = new Map();

const manuals = [
  { octave: 0, channel: 0, element: document.querySelector('[data-manual="0"]') },
  { octave: 1, channel: 1, element: document.querySelector('[data-manual="1"]') }
];

const midiOutSelect = document.getElementById('midiOut');

document.getElementById('connect').addEventListener('click', () => requestMidi(true));
document.getElementById('refresh').addEventListener('click', () => requestMidi(false));
document.getElementById('panic').addEventListener('click', panic);

document.querySelectorAll('.octave').forEach((sel, i) => {
  sel.addEventListener('change', e => manuals[i].octave = Number(e.target.value));
});
document.querySelectorAll('.channel').forEach((sel, i) => {
  sel.addEventListener('change', e => manuals[i].channel = Number(e.target.value));
});

manuals.forEach((manual, mIdx) => {
  const kb = manual.element;
  kb.innerHTML = '';
  
  let whiteCount = 0;
  for (let i = 0; i < NUM_KEYS; i++) {
    if (!BLACK_SEMITONES.includes(i % 12)) whiteCount++;
  }

  // Build White Keys
  for (let i = 0; i < NUM_KEYS; i++) {
    if (!BLACK_SEMITONES.includes(i % 12)) {
      const key = document.createElement('div');
      key.className = 'white-key';
      key.dataset.semitone = i;
      
      const noteName = NOTE_NAMES[i % 12];
      const pitchOctave = Math.floor(((manual.octave + 4) * 12 + i) / 12) - 1;
      const isC = noteName === 'C';
      
      key.innerHTML = `<div class="key-label ${isC ? 'show-label' : ''}">${noteName}${isC ? pitchOctave : ''}</div>`;
      kb.appendChild(key);
    }
  }

  // Build Black Keys
  const whiteWidthPercent = 100 / whiteCount;
  const blackWidthPercent = whiteWidthPercent * 0.65;

  for (let i = 0; i < NUM_KEYS; i++) {
    const semitone = i % 12;
    if (BLACK_SEMITONES.includes(semitone)) {
      const octave = Math.floor(i / 12);
      
      let whiteIndexInOctave = 0;
      if (semitone === 1) whiteIndexInOctave = 0;
      else if (semitone === 3) whiteIndexInOctave = 1;
      else if (semitone === 6) whiteIndexInOctave = 3;
      else if (semitone === 8) whiteIndexInOctave = 4;
      else if (semitone === 10) whiteIndexInOctave = 5;

      const absoluteWhiteIndex = octave * 7 + whiteIndexInOctave;
      const leftPercent = (absoluteWhiteIndex * whiteWidthPercent) + (whiteWidthPercent * 0.675);

      const key = document.createElement('div');
      key.className = 'black-key';
      key.dataset.semitone = i;
      key.style.left = leftPercent + '%';
      key.style.width = blackWidthPercent + '%';
      key.style.height = '62%'; // Taller black keys
      
      kb.appendChild(key);
    }
  }

  kb.addEventListener('pointerdown', e => { kb.setPointerCapture(e.pointerId); handlePointer(e, mIdx); });
  kb.addEventListener('pointermove', e => { if (activePointers.has(e.pointerId)) handlePointer(e, mIdx); });
  kb.addEventListener('pointerup', e => releasePointer(e.pointerId));
  kb.addEventListener('pointercancel', e => releasePointer(e.pointerId));
});

function handlePointer(e, mIdx) {
  const target = document.elementFromPoint(e.clientX, e.clientY);
  const keyElement = target?.closest('.white-key, .black-key');
  if (!keyElement) return;

  const semitone = Number(keyElement.dataset.semitone);
  const manual = manuals[mIdx];
  const midiNote = (manual.octave + 4) * 12 + semitone; 
  
  if (activePointers.has(e.pointerId)) {
    const old = activePointers.get(e.pointerId);
    if (old.midiNote === midiNote) return; 
    releaseNote(old.midiNote, mIdx, old.element);
  }

  keyElement.classList.add('active');
  
  playSynthNote(midiNote, 100);
  sendMidi(0x90 | manual.channel, midiNote, 100);
  activePointers.set(e.pointerId, { midiNote, element: keyElement, mIdx });
}

function releasePointer(pointerId) {
  if (!activePointers.has(pointerId)) return;
  const { midiNote, element, mIdx } = activePointers.get(pointerId);
  
  element.classList.remove('active');
  stopSynthNote(midiNote);
  sendMidi(0x80 | manuals[mIdx].channel, midiNote, 0);
  
  activePointers.delete(pointerId);
}

function releaseNote(midiNote, mIdx, element) {
  element.classList.remove('active');
  stopSynthNote(midiNote);
  sendMidi(0x80 | manuals[mIdx].channel, midiNote, 0);
}

function panic() {
  for (let ch = 0; ch < 16; ch++) sendMidi(0xB0 | ch, 123, 0);
  document.querySelectorAll('.active').forEach(el => el.classList.remove('active'));
  activePointers.clear();
  activeVoices.forEach((voice, note) => stopSynthNote(note));
}

async function requestMidi(showAlert) {
  if (!navigator.requestMIDIAccess) {
    if (showAlert) alert('Web MIDI not supported in this browser.');
    return;
  }
  try {
    midiAccess = await navigator.requestMIDIAccess({ sysex: false });
    updatePorts();
    
    // This listens for Bluetooth devices connecting/disconnecting in the OS
    midiAccess.onstatechange = updatePorts;
    
    if (showAlert && midiAccess.outputs.size === 0) {
      alert("No MIDI ports found. If using Bluetooth, pair the devices in your system settings first, then tap Refresh.");
    }
  } catch (err) { 
    if (showAlert) alert('MIDI access denied.'); 
  }
}

function updatePorts() {
  if (!midiAccess) return;
  
  const currentVal = midiOutSelect.value;
  midiOutSelect.innerHTML = '<option value="">None</option>';
  
  let foundSelected = false;
  
  for (const out of midiAccess.outputs.values()) {
    const opt = document.createElement('option');
    opt.value = out.id;
    opt.textContent = out.name;
    midiOutSelect.appendChild(opt);
    
    if (out.id === currentVal) foundSelected = true;
  }
  
  // Restore selection if it still exists
  if (foundSelected) {
    midiOutSelect.value = currentVal;
  } else {
    selectedOutput = null;
  }
}

midiOutSelect.addEventListener('change', e => {
  if (!midiAccess) return;
  selectedOutput = midiAccess.outputs.get(e.target.value) || null;
});

function sendMidi(status, data1, data2) {
  if (selectedOutput) selectedOutput.send([status, data1, data2]);
}
</script>
</body>
</html>
