<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dual Manual Piano</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #121417;
  color: #e8eaed;
  font-family: system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

.app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 2px;
  gap: 2px;
}

/* Compact Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  padding: 2px 4px;
  background: #1c2026;
  border: 1px solid #343a43;
  border-radius: 5px;
}

.spacer {
  flex: 1;
}

button, select {
  padding: 3px 6px;
  border: 1px solid #49515d;
  border-radius: 4px;
  background: #12171d;
  color: #eee;
  font: 600 10px system-ui, sans-serif;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

#pianoButton { background: #69501a; }
#bleButton { background: #0869a8; }
#bleButton.connected { background: #287334; }
#panicButton { background: #ae2727; }

/* Settings Overlay */
#settings {
  position: absolute;
  top: 35px;
  right: 5px;
  width: 320px;
  z-index: 100;
  padding: 8px;
  background: #1c2026;
  border: 1px solid #49515d;
  border-radius: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}

#settings[hidden] {
  display: none;
}

.settings-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
}

.settings-row + .settings-row {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid #343a43;
}

label {
  white-space: nowrap;
  font-size: 10px;
  color: #b0bac7;
}

input[type="range"] {
  width: 70px;
  vertical-align: middle;
  accent-color: #ffcc4d;
}

#midiOutput {
  max-width: 150px;
}

/* Manuals & Keyboards */
.manual {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 2px;
  background: #1c2026;
  border: 1px solid #343a43;
  border-radius: 5px;
}

.manual-header {
  display: flex;
  align-items: center;
  gap: 5px;
  min-height: 18px;
  flex-shrink: 0;
  padding: 0 2px;
  margin-bottom: 2px;
  cursor: grab;
}

.manual-header:active {
  cursor: grabbing;
}

.manual-title {
  margin-right: auto;
  color: #b3bcc8;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.manual-header label {
  font-size: 9px;
  color: #8892a0;
}

.manual-header select {
  padding: 1px 2px;
  font-size: 9px;
  border-radius: 3px;
  cursor: pointer;
}

/* Scrollable Keyboard Area */
.keyboard-scroll {
  overflow-x: auto;
  overflow-y: hidden;
  flex: 1;
  min-height: 0;
  width: 100%;
  -webkit-overflow-scrolling: touch;
}

.keyboard-scroll::-webkit-scrollbar {
  height: 8px;
}
.keyboard-scroll::-webkit-scrollbar-track {
  background: #121417;
  border-radius: 4px;
}
.keyboard-scroll::-webkit-scrollbar-thumb {
  background: #49515d;
  border-radius: 4px;
}

.keyboard {
  position: relative;
  display: flex;
  min-width: max-content;
  height: 100%;
}

.key {
  touch-action: none;
}

.white-key {
  position: relative;
  flex: 0 0 48px;
  width: 48px;
  height: 100%;
  background: linear-gradient(#fff, #e0e0e0);
  border-right: 1px solid #999;
  border-bottom: 4px solid #aaa;
  border-radius: 0 0 3px 3px;
}

.black-key {
  position: absolute;
  top: 0;
  height: 62%;
  z-index: 2;
  background: linear-gradient(#333, #000);
  border-bottom: 3px solid #000;
  border-radius: 0 0 3px 3px;
  box-shadow: 0 3px 4px #000a;
}

.key.active {
  background: linear-gradient(#ffe8a5, #ffb300);
  border-bottom-color: #c99521;
}

.key-label {
  position: absolute;
  bottom: 3px;
  left: 4px;
  color: #888;
  font-size: 8px;
  pointer-events: none;
}
</style>
</head>

<body>
<div class="app">

  <header class="toolbar">
    <button id="pianoButton">Load Online Piano</button>
    <div class="spacer"></div>
    <button id="bleButton">BLE Connect</button>
    <button id="panicButton">Panic</button>
    <button id="settingsButton" aria-expanded="false">Settings</button>
  </header>

  <div id="settings" hidden>
    <div class="settings-row">
      <label>
        Master
        <input id="masterVolume" type="range" min="0" max="1" step="0.01" value="0.5">
      </label>
      <label>
        <input id="localSound" type="checkbox" checked> Local Sound
      </label>
    </div>

    <div class="settings-row">
      <button id="usbButton">USB MIDI</button>
      <select id="midiOutput">
        <option value="">No USB MIDI output</option>
      </select>
    </div>

    <div class="settings-row">
      <label>
        Upper Vol
        <input id="upperVolume" type="range" min="0" max="2" step="0.05" value="1">
        <span id="upperValue">100%</span>
      </label>
    </div>
    <div class="settings-row">
      <label>
        Lower Vol
        <input id="lowerVolume" type="range" min="0" max="2" step="0.05" value="1.5">
        <span id="lowerValue">150%</span>
      </label>
    </div>
    
    <div class="settings-row">
      <button id="testButton" style="width: 100%;">Test MIDI: C4 / Ch 1</button>
    </div>
  </div>

  <!-- UPPER (Top) -->
  <section class="manual" id="upperManual">
    <div class="manual-header">
      <div class="manual-title">UPPER (Drag to Scroll)</div>
      <label>Oct <select class="octave"></select></label>
      <label>Ch <select class="channel"></select></label>
      <label>Keys <select class="keyCount">
        <option value="25">25</option>
        <option value="37">37</option>
        <option value="49">49</option>
        <option value="61">61</option>
      </select></label>
    </div>
    <div class="keyboard-scroll">
      <div class="keyboard"></div>
    </div>
  </section>

  <!-- LOWER (Bottom) -->
  <section class="manual" id="lowerManual">
    <div class="manual-header">
      <div class="manual-title">LOWER (Drag to Scroll)</div>
      <label>Oct <select class="octave"></select></label>
      <label>Ch <select class="channel"></select></label>
      <label>Keys <select class="keyCount">
        <option value="25">25</option>
        <option value="37">37</option>
        <option value="49">49</option>
        <option value="61">61</option>
      </select></label>
    </div>
    <div class="keyboard-scroll">
      <div class="keyboard"></div>
    </div>
  </section>

</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const log = console.log; 

const manuals = [
  {
    root: $("upperManual"),
    octave: 1,
    channel: 1,
    keyCount: 37,
    volume: 1,
    bus: null
  },
  {
    root: $("lowerManual"),
    octave: 0,
    channel: 0,
    keyCount: 37,
    volume: 1.5,
    bus: null
  }
];

$("settingsButton").addEventListener("click", () => {
  const panel = $("settings");
  panel.hidden = !panel.hidden;
  $("settingsButton").textContent = panel.hidden ? "Settings" : "Close";
});

// ==========================================
// LOCAL AUDIO (Offline Synth)
// ==========================================

let audioContext = null;
let masterGain = null;
let compressor = null;
let pianoPlayers = null;
let pianoLoading = false;

function initAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioContext.createGain();
    masterGain.gain.value = Number($("masterVolume").value);

    compressor = audioContext.createDynamicsCompressor();
    compressor.threshold.value = -10;
    compressor.knee.value = 12;
    compressor.ratio.value = 6;

    masterGain.connect(compressor);
    compressor.connect(audioContext.destination);

    manuals.forEach(manual => {
      manual.bus = audioContext.createGain();
      manual.bus.gain.value = manual.volume;
      manual.bus.connect(masterGain);
    });
  }

  if (audioContext.state === "suspended") {
    audioContext.resume().catch(e => log(e.message));
  }
}

$("masterVolume").addEventListener("input", e => {
  if (masterGain) {
    masterGain.gain.setTargetAtTime(Number(e.target.value), audioContext.currentTime, 0.02);
  }
});

[
  ["upperVolume", "upperValue", 0],
  ["lowerVolume", "lowerValue", 1]
].forEach(([sliderId, valueId, index]) => {
  $(sliderId).addEventListener("input", e => {
    const volume = Number(e.target.value);
    manuals[index].volume = volume;
    $(valueId).textContent = Math.round(volume * 100) + "%";
    if (manuals[index].bus) {
      manuals[index].bus.gain.setTargetAtTime(volume, audioContext.currentTime, 0.02);
    }
  });
});

function loadPianoLibrary() {
  if (window.Soundfont) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.js";
    script.onload = () => window.Soundfont ? resolve() : reject(new Error("Init failed"));
    script.onerror = () => { script.remove(); reject(new Error("Download failed")); };
    document.head.appendChild(script);
  });
}

$("pianoButton").addEventListener("click", async () => {
  initAudio();
  if (pianoLoading) return;
  if (pianoPlayers) { alert("Online Grand Piano already loaded."); return; }

  pianoLoading = true;
  $("pianoButton").disabled = true;
  $("pianoButton").textContent = "Loading...";

  try {
    await loadPianoLibrary();
    pianoPlayers = await Promise.all(
      manuals.map(manual =>
        Soundfont.instrument(audioContext, "acoustic_grand_piano", {
          soundfont: "MusyngKite", format: "mp3", destination: manual.bus, release: 0.35
        })
      )
    );
    $("pianoButton").textContent = "Piano Ready";
  } catch (error) {
    $("pianoButton").textContent = "Retry Piano";
    log("Piano failed: " + error.message);
  } finally {
    pianoLoading = false;
    $("pianoButton").disabled = false;
  }
});

function createVoice(note, manualIndex) {
  if (!$("localSound").checked) return null;
  initAudio();

  if (pianoPlayers) {
    const voice = pianoPlayers[manualIndex].play(note, audioContext.currentTime, { gain: 0.45 });
    return () => voice.stop();
  }

  // Built-in Offline Synth
  const now = audioContext.currentTime;
  const freq = 440 * Math.pow(2, (note - 69) / 12);
  
  const osc1 = audioContext.createOscillator();
  const osc2 = audioContext.createOscillator();
  const osc3 = audioContext.createOscillator();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  
  osc1.type = "triangle";
  osc2.type = "sine";
  osc3.type = "sawtooth";
  
  osc1.frequency.value = freq;
  osc2.frequency.value = freq;
  osc3.frequency.value = freq * 2;
  
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(freq * 5, now);
  filter.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 1.5);
  
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.4, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.05, now + 2.0);
  
  osc1.connect(filter);
  osc2.connect(filter);
  osc3.connect(filter);
  filter.connect(gain);
  gain.connect(manuals[manualIndex].bus);
  
  osc1.start(now); osc2.start(now); osc3.start(now);
  
  return () => {
    const stopTime = audioContext.currentTime;
    gain.gain.cancelScheduledValues(stopTime);
    gain.gain.setValueAtTime(gain.gain.value, stopTime);
    gain.gain.exponentialRampToValueAtTime(0.001, stopTime + 0.3);
    
    osc1.stop(stopTime + 0.3); osc2.stop(stopTime + 0.3); osc3.stop(stopTime + 0.3);
    
    osc1.onended = () => {
      osc1.disconnect(); osc2.disconnect(); osc3.disconnect(); filter.disconnect(); gain.disconnect();
    };
  };
}

// ==========================================
// MIDI OUTPUT
// ==========================================

let midiAccess = null;
let selectedOutput = null;
const BLE_SERVICE = "03b80e5a-ede8-4b33-a751-6ce34ec4c700";
const BLE_CHARACTERISTIC = "7772e5db-3868-4112-a1a9-f2669d106bf3";
let bleDevice = null;
let bleCharacteristic = null;
let bleConnecting = false;
let bleQueue = Promise.resolve();

function sendMidi(status, data1, data2) {
  const isNoteOn = (status & 0xf0) === 0x90 && data2 > 0;

  if (selectedOutput) {
    try { selectedOutput.send([status, data1, data2]); } 
    catch (error) { log("USB MIDI error: " + error.message); }
  }

  const characteristic = bleCharacteristic;
  if (!characteristic) return;

  bleQueue = bleQueue.then(async () => {
    if (characteristic !== bleCharacteristic) return;

    const timestamp = Math.floor(performance.now()) & 0x1fff;
    const packet = new Uint8Array([
      0x80 | ((timestamp >> 7) & 0x3f),
      0x80 | (timestamp & 0x7f),
      status, data1, data2
    ]);

    if (characteristic.properties.writeWithoutResponse) {
      await characteristic.writeValueWithoutResponse(packet);
    } else {
      await characteristic.writeValue(packet);
    }
  }).catch(error => log("BLE write error: " + error.message));
}

function updatePorts() {
  const previousId = $("midiOutput").value;
  $("midiOutput").replaceChildren(new Option("No USB MIDI output", ""));

  for (const output of midiAccess.outputs.values()) {
    $("midiOutput").add(new Option(output.name || output.id, output.id));
  }

  $("midiOutput").value = midiAccess.outputs.has(previousId) ? previousId : "";
  selectedOutput = midiAccess.outputs.get($("midiOutput").value) || null;
}

$("usbButton").addEventListener("click", async () => {
  initAudio();
  if (!navigator.requestMIDIAccess) return alert("Web MIDI unavailable.");
  try {
    midiAccess = await navigator.requestMIDIAccess({ sysex: false });
    updatePorts();
    midiAccess.onstatechange = updatePorts;
  } catch (error) { alert("USB MIDI error: " + error.message); }
});

$("midiOutput").addEventListener("change", () => {
  panic();
  selectedOutput = midiAccess?.outputs.get($("midiOutput").value) || null;
});

$("bleButton").addEventListener("click", async () => {
  initAudio();
  if (bleConnecting) return;

  if (bleCharacteristic) {
    panic();
    await bleQueue;
    if (bleDevice?.gatt.connected) bleDevice.gatt.disconnect();
    return;
  }

  if (!navigator.bluetooth) return alert("Web Bluetooth unavailable.");

  bleConnecting = true;

  try {
    bleDevice = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [BLE_SERVICE]
    });

    bleDevice.addEventListener("gattserverdisconnected", () => {
      bleCharacteristic = null;
      $("bleButton").textContent = "BLE Connect";
      $("bleButton").classList.remove("connected");
      panic();
    });

    const server = await bleDevice.gatt.connect();
    const service = await server.getPrimaryService(BLE_SERVICE);
    const characteristic = await service.getCharacteristic(BLE_CHARACTERISTIC);

    bleCharacteristic = characteristic;

    if (characteristic.properties.notify) {
      await characteristic.startNotifications();
    }

    $("bleButton").textContent = "BLE Connected";
    $("bleButton").classList.add("connected");
  } catch (error) {
    bleCharacteristic = null;
    if (bleDevice?.gatt.connected) bleDevice.gatt.disconnect();
    alert("BLE Error: " + error.message);
  } finally {
    bleConnecting = false;
  }
});

// ==========================================
// NOTE TRACKING & SLIDING
// ==========================================

const activeNotes = new Map();
const activePointers = new Map();
const midiCounts = new Map();

function startNote(pointerId, key, manualIndex) {
  const manual = manuals[manualIndex];
  const note = 48 + 12 * manual.octave + Number(key.dataset.semitone);
  const channel = manual.channel;
  const midiKey = channel + ":" + note;

  const count = midiCounts.get(midiKey) || 0;
  midiCounts.set(midiKey, count + 1);

  if (count === 0) sendMidi(0x90 | channel, note, 100);

  key.dataset.held = Number(key.dataset.held || 0) + 1;
  key.classList.add("active");

  let stop = null;
  try { stop = createVoice(note, manualIndex); } catch (e) {}

  activeNotes.set(pointerId, { note, channel, midiKey, key, stop });
}

function stopNote(pointerId) {
  const held = activeNotes.get(pointerId);
  if (!held) return;

  activeNotes.delete(pointerId);
  if (held.stop) held.stop();

  const count = (midiCounts.get(held.midiKey) || 1) - 1;

  if (count > 0) {
    midiCounts.set(held.midiKey, count);
  } else {
    midiCounts.delete(held.midiKey);
    sendMidi(0x80 | held.channel, held.note, 0);
  }

  held.key.dataset.held = Math.max(0, Number(held.key.dataset.held || 1) - 1);
  if (Number(held.key.dataset.held) === 0) held.key.classList.remove("active");
}

let testTimer = null;
let testRoute = null;

function finishMidiTest() {
  if (!testRoute) return;
  clearTimeout(testTimer);
  const route = testRoute;
  testRoute = null;

  if (route.output) { try { route.output.send([0x80, 60, 0]); } catch (e) {} }
  if (route.characteristic && route.characteristic === bleCharacteristic) {
    const savedOutput = selectedOutput;
    selectedOutput = null;
    sendMidi(0x80, 60, 0);
    selectedOutput = savedOutput;
  }
}

$("testButton").addEventListener("click", () => {
  if (!bleCharacteristic && !selectedOutput) return alert("Connect MIDI first.");
  if (activeNotes.size > 0 || testRoute) return;

  testRoute = { output: selectedOutput, characteristic: bleCharacteristic };
  sendMidi(0x90, 60, 100);
  testTimer = setTimeout(finishMidiTest, 700);
});

function panic() {
  finishMidiTest();
  for (const id of [...activeNotes.keys()]) stopNote(id);
  activePointers.clear();

  for (let channel = 0; channel < 16; channel++) {
    sendMidi(0xb0 | channel, 64, 0);
    sendMidi(0xb0 | channel, 123, 0);
  }
}

$("panicButton").addEventListener("click", panic);
$("localSound").addEventListener("change", () => {
  for (const held of activeNotes.values()) {
    if (held.stop) { held.stop(); held.stop = null; }
  }
});

window.addEventListener("blur", () => { if (activeNotes.size || testRoute) panic(); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden && (activeNotes.size || testRoute)) panic();
});

// ==========================================
// BUILD BOTH KEYBOARDS
// ==========================================

const BLACK_NOTES = [1, 3, 6, 8, 10];
const WHITE_KEY_WIDTH = 48; // Matches CSS

function updateLabels(manual) {
  const keyboard = manual.root.querySelector(".keyboard");
  if (!keyboard) return;
  for (const key of keyboard.querySelectorAll(".white-key")) {
    const note = 48 + 12 * manual.octave + Number(key.dataset.semitone);
    if (key.firstChild) {
      key.firstChild.textContent = note % 12 === 0 ? "C" + (Math.floor(note / 12) - 1) : "";
    }
  }
}

function buildKeyboard(manual) {
  const keyboard = manual.root.querySelector(".keyboard");
  if (!keyboard) return;
  keyboard.innerHTML = ""; 
  
  let whiteCount = 0;

  for (let semitone = 0; semitone < manual.keyCount; semitone++) {
    const isBlack = BLACK_NOTES.includes(semitone % 12);
    const key = document.createElement("div");
    key.className = "key " + (isBlack ? "black-key" : "white-key");
    key.dataset.semitone = semitone;

    if (!isBlack) {
      whiteCount++;
      const label = document.createElement("span");
      label.className = "key-label";
      key.appendChild(label);
    }
    keyboard.appendChild(key);
  }

  let precedingWhites = 0;

  for (const key of keyboard.children) {
    if (key.classList.contains("white-key")) {
      precedingWhites++;
    } else {
      key.style.left = ((precedingWhites - 0.325) * WHITE_KEY_WIDTH) + "px";
      key.style.width = (WHITE_KEY_WIDTH * 0.65) + "px";
    }
  }

  updateLabels(manual);
}

// Ensure DOM is fully loaded before initializing keyboards
window.addEventListener("DOMContentLoaded", () => {
  manuals.forEach((manual, manualIndex) => {
    const scrollContainer = manual.root.querySelector(".keyboard-scroll");
    const keyboard = manual.root.querySelector(".keyboard");
    const header = manual.root.querySelector(".manual-header");
    
    const octaveSelect = manual.root.querySelector(".octave");
    const channelSelect = manual.root.querySelector(".channel");
    const keyCountSelect = manual.root.querySelector(".keyCount");

    if (!octaveSelect || !channelSelect || !keyCountSelect || !keyboard) return;

    for (let octave = -2; octave <= 2; octave++) {
      octaveSelect.add(new Option(octave > 0 ? "+" + octave : String(octave), octave));
    }
    octaveSelect.value = manual.octave;

    for (let channel = 0; channel < 16; channel++) {
      channelSelect.add(new Option(channel + 1, channel));
    }
    channelSelect.value = manual.channel;
    keyCountSelect.value = manual.keyCount;

    buildKeyboard(manual);

    keyCountSelect.addEventListener("change", () => {
      panic();
      manual.keyCount = Number(keyCountSelect.value);
      buildKeyboard(manual);
    });

    octaveSelect.addEventListener("change", () => {
      panic();
      manual.octave = Number(octaveSelect.value);
      updateLabels(manual);
    });

    channelSelect.addEventListener("change", () => {
      panic();
      manual.channel = Number(channelSelect.value);
    });

    keyboard.addEventListener("contextmenu", e => e.preventDefault());

    // Drag the header to pan the keyboard
    let isDraggingHeader = false;
    let headerStartX = 0;
    let headerScrollStart = 0;

    header.addEventListener("pointerdown", e => {
      if (e.target.closest("select") || e.target.closest("button")) return;
      isDraggingHeader = true;
      headerStartX = e.clientX;
      headerScrollStart = scrollContainer.scrollLeft;
      header.setPointerCapture(e.pointerId);
    });

    header.addEventListener("pointermove", e => {
      if (!isDraggingHeader) return;
      e.preventDefault();
      const dx = e.clientX - headerStartX;
      scrollContainer.scrollLeft = headerScrollStart - dx;
    });

    const endHeaderDrag = (e) => {
      if (!isDraggingHeader) return;
      isDraggingHeader = false;
      header.releasePointerCapture(e.pointerId);
    };

    header.addEventListener("pointerup", endHeaderDrag);
    header.addEventListener("pointercancel", endHeaderDrag);

    function movePointer(event) {
      const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".key");
      const key = target && keyboard.contains(target) ? target : null;

      if (activePointers.get(event.pointerId) === key) return;

      stopNote(event.pointerId);
      activePointers.set(event.pointerId, key);

      if (key) startNote(event.pointerId, key, manualIndex);
    }

    keyboard.addEventListener("pointerdown", event => {
      event.preventDefault();
      initAudio();
      keyboard.setPointerCapture(event.pointerId);
      activePointers.set(event.pointerId, null);
      movePointer(event);
    }, { passive: false });

    keyboard.addEventListener("pointermove", event => {
      if (!activePointers.has(event.pointerId)) return;
      event.preventDefault();
      movePointer(event);
    }, { passive: false });

    ["pointerup", "pointercancel", "lostpointercapture"].forEach(evtName => {
      keyboard.addEventListener(evtName, event => {
        stopNote(event.pointerId);
        activePointers.delete(event.pointerId);
      });
    });
  });
});
</script>

</body>
