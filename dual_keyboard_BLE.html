<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dual Manual Piano</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #121417;
  color: #eee;
  font: 13px system-ui, sans-serif;
  overflow: hidden;
}

main {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 5px;
}

header, .controls {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
}

header, section {
  background: #20252c;
  border-radius: 7px;
  padding: 6px;
}

button, select {
  background: #15191f;
  color: white;
  border: 1px solid #666;
  border-radius: 5px;
  padding: 6px;
}

button { cursor: pointer; }

input[type="range"] {
  width: 80px;
  vertical-align: middle;
}

label { white-space: nowrap; }

section {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.controls strong { margin-right: auto; }

.keyboard {
  position: relative;
  display: flex;
  flex: 1;
  min-height: 40px;
  overflow: hidden;
  border-radius: 5px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.key { touch-action: none; }

.white {
  position: relative;
  flex: 1;
  min-width: 0;
  background: linear-gradient(white, #ddd);
  border-right: 1px solid #888;
  border-bottom: 3px solid #aaa;
  border-radius: 0 0 4px 4px;
}

.black {
  position: absolute;
  top: 0;
  height: 62%;
  z-index: 2;
  background: linear-gradient(#333, #080808);
  border-radius: 0 0 4px 4px;
  box-shadow: 0 3px 4px #555;
}

.key.active {
  background: linear-gradient(#ffe6a0, #ffbf29);
}

.label {
  position: absolute;
  bottom: 5px;
  left: 3px;
  color: #777;
  font-size: 10px;
  pointer-events: none;
}

#status {
  background: black;
  color: #9f9;
  padding: 5px;
  min-height: 26px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font: 12px monospace;
}

#ble { background: #086aa8; }
#panic { background: #a62929; }
#out { max-width: 140px; }
</style>
</head>

<body>
<main>

<header>
  <button id="audio">Load piano</button>

  <label>
    Master
    <input id="master" type="range"
      min="0" max="1" step="0.01" value="0.5">
  </label>

  <label>
    <input id="local" type="checkbox" checked>
    Local sound
  </label>

  <button id="usb">USB MIDI</button>

  <select id="out">
    <option value="">No USB output</option>
  </select>

  <button id="ble">BLE Connect</button>
  <button id="panic">Panic</button>
</header>

<div id="status">
  Tap Load piano. Internet is needed to download the samples.
</div>

<section id="lower">
  <div class="controls">
    <strong>LOWER</strong>

    <label>Oct <select class="oct"></select></label>
    <label>Ch <select class="ch"></select></label>

    <label>
      Volume
      <input class="vol" type="range"
        min="0" max="2" step="0.05" value="1.5">
      <span>150%</span>
    </label>
  </div>

  <div class="keyboard"></div>
</section>

<section id="upper">
  <div class="controls">
    <strong>UPPER</strong>

    <label>Oct <select class="oct"></select></label>
    <label>Ch <select class="ch"></select></label>

    <label>
      Volume
      <input class="vol" type="range"
        min="0" max="2" step="0.05" value="1">
      <span>100%</span>
    </label>
  </div>

  <div class="keyboard"></div>
</section>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const log = message => {
  $("status").textContent = message;
};

let ctx;
let master;
let compressor;
let pianoPlayers = null;
let pianoLoading = false;

let midiAccess = null;
let midiOutput = null;

let bleDevice = null;
let bleCharacteristic = null;
let bleConnecting = false;
let bleQueue = Promise.resolve();

const SERVICE =
  "03b80e5a-ede8-4b33-a751-6ce34ec4c700";

const CHARACTERISTIC =
  "7772e5db-3868-4112-a1a9-f2669d106bf3";

const manuals = ["lower", "upper"].map((id, index) => ({
  root: $(id),
  octave: index,
  channel: index,
  volume: index === 0 ? 1.5 : 1,
  bus: null
}));

const heldNotes = new Map();
const pointers = new Map();
const midiNoteCounts = new Map();

function initAudio() {
  if (!ctx) {
    ctx = new (
      window.AudioContext || window.webkitAudioContext
    )();

    master = ctx.createGain();
    master.gain.value = Number($("master").value);

    compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -10;
    compressor.knee.value = 12;
    compressor.ratio.value = 6;

    master.connect(compressor);
    compressor.connect(ctx.destination);

    manuals.forEach(manual => {
      manual.bus = ctx.createGain();
      manual.bus.gain.value = manual.volume;
      manual.bus.connect(master);
    });
  }

  if (ctx.state === "suspended") {
    ctx.resume().catch(error => log(error.message));
  }
}

$("master").addEventListener("input", event => {
  if (master) {
    master.gain.setTargetAtTime(
      Number(event.target.value),
      ctx.currentTime,
      0.02
    );
  }
});

async function loadPiano() {
  initAudio();

  if (pianoLoading) return;

  if (pianoPlayers) {
    log("Grand piano ready.");
    return;
  }

  pianoLoading = true;
  $("audio").disabled = true;
  log("Loading piano samples... synth remains available.");

  try {
    if (!window.Soundfont) {
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");

        script.src =
          "https://cdn.jsdelivr.net/npm/" +
          "soundfont-player@0.12.0/dist/soundfont-player.js";

        script.onload = resolve;

        script.onerror = () => {
          reject(new Error("Piano library download failed"));
        };

        document.head.appendChild(script);
      });
    }

    // One player per manual routes notes through its own volume.
    const players = await Promise.all(
      manuals.map(manual =>
        Soundfont.instrument(ctx, "acoustic_grand_piano", {
          soundfont: "MusyngKite",
          format: "mp3",
          destination: manual.bus,
          release: 0.35
        })
      )
    );

    pianoPlayers = players;

    $("audio").textContent = "Piano ready";
    log("Grand piano ready. Adjust each keyboard's volume to taste.");
  } catch (error) {
    log(
      "Piano unavailable: " + error.message +
      ". Synth fallback active; tap Load piano to retry."
    );
  } finally {
    pianoLoading = false;
    $("audio").disabled = false;
  }
}

$("audio").addEventListener("click", loadPiano);

function createLocalVoice(note, manualIndex) {
  if (!$("local").checked) return null;

  initAudio();

  if (pianoPlayers) {
    const voice = pianoPlayers[manualIndex].play(
      note,
      ctx.currentTime,
      { gain: 0.45 }
    );

    return () => voice.stop();
  }

  // Simple fallback sound while piano samples are unavailable.
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  const gain = ctx.createGain();

  const frequency = 440 * 2 ** ((note - 69) / 12);

  osc1.type = "triangle";
  osc2.type = "sine";

  osc1.frequency.value = frequency;
  osc2.frequency.value = frequency * 2;

  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(
    0.1,
    ctx.currentTime + 0.02
  );

  osc1.connect(gain);
  osc2.connect(gain);
  gain.connect(manuals[manualIndex].bus);

  osc1.start();
  osc2.start();

  return () => {
    const now = ctx.currentTime;

    gain.gain.cancelScheduledValues(now);
    gain.gain.setTargetAtTime(0, now, 0.06);

    osc1.stop(now + 0.4);
    osc2.stop(now + 0.4);

    osc1.onended = () => {
      osc1.disconnect();
      osc2.disconnect();
      gain.disconnect();
    };
  };
}

function sendMidi(status, note, velocity) {
  if (midiOutput) {
    try {
      midiOutput.send([status, note, velocity]);
    } catch (error) {
      log("USB MIDI: " + error.message);
    }
  }

  const characteristic = bleCharacteristic;
  if (!characteristic) return;

  // Serialize BLE writes to avoid overlapping GATT operations.
  bleQueue = bleQueue.then(async () => {
    if (characteristic !== bleCharacteristic) return;

    const timestamp = Math.floor(performance.now()) & 0x1fff;

    const packet = new Uint8Array([
      0x80 | ((timestamp >> 7) & 0x3f),
      0x80 | (timestamp & 0x7f),
      status,
      note,
      velocity
    ]);

    if (
      characteristic.properties.writeWithoutResponse &&
      characteristic.writeValueWithoutResponse
    ) {
      await characteristic.writeValueWithoutResponse(packet);
    } else if (characteristic.writeValueWithResponse) {
      await characteristic.writeValueWithResponse(packet);
    } else {
      await characteristic.writeValue(packet);
    }
  }).catch(error => {
    log("BLE write: " + error.message);
  });
}

function startNote(pointerId, key, manualIndex) {
  const manual = manuals[manualIndex];

  const note =
    48 + manual.octave * 12 + Number(key.dataset.note);

  const channel = manual.channel;
  const midiKey = channel + ":" + note;

  const count = midiNoteCounts.get(midiKey) || 0;
  midiNoteCounts.set(midiKey, count + 1);

  if (count === 0) {
    sendMidi(0x90 | channel, note, 100);
  }

  key.dataset.held = Number(key.dataset.held || 0) + 1;
  key.classList.add("active");

  heldNotes.set(pointerId, {
    note,
    channel,
    midiKey,
    key,
    stop: createLocalVoice(note, manualIndex)
  });
}

function stopNote(pointerId) {
  const held = heldNotes.get(pointerId);
  if (!held) return;

  heldNotes.delete(pointerId);

  if (held.stop) held.stop();

  const count =
    (midiNoteCounts.get(held.midiKey) || 1) - 1;

  if (count > 0) {
    midiNoteCounts.set(held.midiKey, count);
  } else {
    midiNoteCounts.delete(held.midiKey);
    sendMidi(0x80 | held.channel, held.note, 0);
  }

  held.key.dataset.held = Math.max(
    0,
    Number(held.key.dataset.held || 1) - 1
  );

  if (Number(held.key.dataset.held) === 0) {
    held.key.classList.remove("active");
  }
}

function panic() {
  for (const id of [...heldNotes.keys()]) {
    stopNote(id);
  }

  pointers.clear();

  for (let channel = 0; channel < 16; channel++) {
    sendMidi(0xb0 | channel, 64, 0);
    sendMidi(0xb0 | channel, 123, 0);
  }

  log("All notes released.");
}

$("panic").addEventListener("click", panic);

$("local").addEventListener("change", () => {
  for (const held of heldNotes.values()) {
    if (held.stop) {
      held.stop();
      held.stop = null;
    }
  }
});

window.addEventListener("blur", panic);

document.addEventListener("visibilitychange", () => {
  if (document.hidden) panic();
});

manuals.forEach((manual, manualIndex) => {
  const keyboard = manual.root.querySelector(".keyboard");
  const octaveSelect = manual.root.querySelector(".oct");
  const channelSelect = manual.root.querySelector(".ch");
  const volumeSlider = manual.root.querySelector(".vol");

  for (let octave = -2; octave <= 2; octave++) {
    octaveSelect.add(new Option(
      octave > 0 ? "+" + octave : String(octave),
      octave
    ));
  }

  octaveSelect.value = manual.octave;

  for (let channel = 0; channel < 16; channel++) {
    channelSelect.add(new Option(channel + 1, channel));
  }

  channelSelect.value = manual.channel;

  const blackSemitones = [1, 3, 6, 8, 10];
  let whiteCount = 0;

  for (let note = 0; note < 37; note++) {
    const key = document.createElement("div");
    const isBlack = blackSemitones.includes(note % 12);

    key.className = "key " + (isBlack ? "black" : "white");
    key.dataset.note = note;

    if (!isBlack) {
      whiteCount++;

      const label = document.createElement("span");
      label.className = "label";
      key.appendChild(label);
    }

    keyboard.appendChild(key);
  }

  let precedingWhites = 0;

  for (const key of keyboard.children) {
    if (key.classList.contains("white")) {
      precedingWhites++;
    } else {
      key.style.left =
        ((precedingWhites - 0.325) * 100 / whiteCount) + "%";

      key.style.width = (65 / whiteCount) + "%";
    }
  }

  function updateLabels() {
    for (const key of keyboard.querySelectorAll(".white")) {
      const note =
        48 + manual.octave * 12 + Number(key.dataset.note);

      key.firstChild.textContent =
        note % 12 === 0
          ? "C" + (Math.floor(note / 12) - 1)
          : "";
    }
  }

  updateLabels();

  octaveSelect.addEventListener("change", () => {
    panic();
    manual.octave = Number(octaveSelect.value);
    updateLabels();
  });

  channelSelect.addEventListener("change", () => {
    panic();
    manual.channel = Number(channelSelect.value);
  });

  volumeSlider.addEventListener("input", event => {
    manual.volume = Number(event.target.value);

    event.target.nextElementSibling.textContent =
      Math.round(manual.volume * 100) + "%";

    if (manual.bus) {
      manual.bus.gain.setTargetAtTime(
        manual.volume,
        ctx.currentTime,
        0.02
      );
    }
  });

  // Suppress long-press menus and selection.
  for (const name of ["contextmenu", "selectstart", "dragstart"]) {
    keyboard.addEventListener(name, event => {
      event.preventDefault();
    });
  }

  function movePointer(event) {
    const target = document.elementFromPoint(
      event.clientX,
      event.clientY
    )?.closest(".key");

    const key =
      target && keyboard.contains(target) ? target : null;

    if (pointers.get(event.pointerId) === key) return;

    stopNote(event.pointerId);
    pointers.set(event.pointerId, key);

    if (key) {
      startNote(event.pointerId, key, manualIndex);
    }
  }

  keyboard.addEventListener("pointerdown", event => {
    event.preventDefault();
    initAudio();

    keyboard.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, null);
    movePointer(event);
  }, { passive: false });

  keyboard.addEventListener("pointermove", event => {
    if (pointers.has(event.pointerId)) {
      event.preventDefault();
      movePointer(event);
    }
  }, { passive: false });

  for (const name of [
    "pointerup",
    "pointercancel",
    "lostpointercapture"
  ]) {
    keyboard.addEventListener(name, event => {
      stopNote(event.pointerId);
      pointers.delete(event.pointerId);
    });
  }
});

function updatePorts() {
  const previousId = $("out").value;

  $("out").replaceChildren(
    new Option("No USB output", "")
  );

  for (const output of midiAccess.outputs.values()) {
    $("out").add(new Option(
      output.name || output.id,
      output.id
    ));
  }

  $("out").value =
    midiAccess.outputs.has(previousId) ? previousId : "";

  midiOutput =
    midiAccess.outputs.get($("out").value) || null;
}

$("usb").addEventListener("click", async () => {
  initAudio();

  if (!navigator.requestMIDIAccess) {
    log("Web MIDI unavailable. BLE Connect is separate.");
    return;
  }

  try {
    midiAccess = await navigator.requestMIDIAccess({
      sysex: false
    });

    updatePorts();
    midiAccess.onstatechange = updatePorts;

    log("Select a USB MIDI output.");
  } catch (error) {
    log("USB MIDI: " + error.message);
  }
});

$("out").addEventListener("change", () => {
  panic();

  midiOutput =
    midiAccess?.outputs.get($("out").value) || null;
});

$("ble").addEventListener("click", async () => {
  initAudio();

  if (bleConnecting) return;

  if (bleCharacteristic) {
    panic();
    await bleQueue;
    bleDevice.gatt.disconnect();
    return;
  }

  if (!window.isSecureContext) {
    log("BLE requires HTTPS or localhost.");
    return;
  }

  if (!navigator.bluetooth) {
    log("Web Bluetooth unavailable. Try Chrome on Android.");
    return;
  }

  bleConnecting = true;

  try {
    bleDevice = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [SERVICE]
    });

    bleDevice.addEventListener(
      "gattserverdisconnected",
      () => {
        bleCharacteristic = null;
        $("ble").textContent = "BLE Connect";
        panic();
        log("BLE disconnected.");
      },
      { once: true }
    );

    log("Connecting to " + (bleDevice.name || "BLE device"));

    const server = await bleDevice.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);

    const characteristic =
      await service.getCharacteristic(CHARACTERISTIC);

    if (
      !characteristic.properties.write &&
      !characteristic.properties.writeWithoutResponse
    ) {
      throw new Error("MIDI characteristic is not writable");
    }

    bleCharacteristic = characteristic;

    $("ble").textContent = "BLE connected / Disconnect";
    log("BLE MIDI output connected.");
  } catch (error) {
    bleCharacteristic = null;

    if (bleDevice?.gatt.connected) {
      bleDevice.gatt.disconnect();
    }

    log("BLE: " + error.message);
  } finally {
    bleConnecting = false;
  }
});
</script>

</body>
</html>
