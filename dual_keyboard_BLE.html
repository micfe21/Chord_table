<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Dual Manual Piano — Compact V3</title>

<style>
/* All styling belongs inside this style block. */

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #121417;
  color: #e8eaed;
  font-family: system-ui, sans-serif;
}

.app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 3px;
}

.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 5px;
  flex-shrink: 0;
  padding: 3px 5px;
  background: #1c2026;
  border: 1px solid #343a43;
  border-radius: 7px;
}

.spacer {
  flex: 1;
}

button, select {
  padding: 5px 8px;
  border: 1px solid #49515d;
  border-radius: 5px;
  background: #12171d;
  color: #eee;
  font: 600 11px system-ui, sans-serif;
}

button {
  cursor: pointer;
  white-space: nowrap;
}

button:disabled {
  opacity: 0.65;
}

#pianoButton {
  background: #69501a;
}

#bleButton {
  background: #0869a8;
}

#bleButton.connected {
  background: #287334;
}

#panicButton {
  background: #ae2727;
}

#status {
  height: 18px;
  min-height: 18px;
  flex-shrink: 0;
  padding: 2px 5px;
  border-radius: 4px;
  background: black;
  color: #a4efa4;
  font: 10px/14px monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#settings {
  flex-shrink: 0;
  max-height: 35vh;
  overflow: auto;
  padding: 8px;
  background: #1c2026;
  border: 1px solid #343a43;
  border-radius: 6px;
}

#settings[hidden] {
  display: none;
}

.settings-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
}

.settings-row + .settings-row {
  margin-top: 9px;
}

label {
  white-space: nowrap;
  font-size: 11px;
}

input[type="range"] {
  width: 95px;
  vertical-align: middle;
  accent-color: #ffcc4d;
}

.hint {
  margin-top: 7px;
  color: #aeb7c3;
  font-size: 10px;
}

#midiOutput {
  max-width: 230px;
}

.manual {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 3px;
  background: #1c2026;
  border: 1px solid #343a43;
  border-radius: 7px;
}

.manual-header {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 21px;
  flex-shrink: 0;
  padding: 0 3px;
}

.manual-title {
  margin-right: auto;
  color: #b3bcc8;
  font-size: 10px;
  font-weight: 700;
}

.manual-header label {
  color: #b3bcc8;
  font-size: 10px;
}

.manual-header select {
  padding: 1px 3px;
  font-size: 10px;
}

.keyboard {
  position: relative;
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  border-radius: 5px;
  background: black;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.key {
  touch-action: none;
}

.white-key {
  position: relative;
  flex: 1;
  min-width: 0;
  background: linear-gradient(#fdfdfd, #dcdcdc);
  border-right: 1px solid #999;
  border-bottom: 3px solid #bbb;
  border-radius: 0 0 4px 4px;
}

.black-key {
  position: absolute;
  top: 0;
  height: 62%;
  z-index: 2;
  background: linear-gradient(#303030, #080808);
  border-bottom: 3px solid black;
  border-radius: 0 0 4px 4px;
  box-shadow: 0 4px 5px #0008;
}

.key.active {
  background: linear-gradient(#ffe8a5, #ffc139);
  border-bottom-color: #c99521;
}

.key-label {
  position: absolute;
  bottom: 5px;
  left: 4px;
  color: #888;
  font-size: 9px;
  pointer-events: none;
}
</style>
</head>

<body>
<div class="app">

  <header class="toolbar">
    <button id="pianoButton">Load piano</button>
    <div class="spacer"></div>
    <button id="bleButton">BLE Connect</button>
    <button id="panicButton">Panic</button>
    <button id="settingsButton"
            aria-expanded="false"
            aria-controls="settings">
      Settings
    </button>
  </header>

  <div id="settings" hidden>
    <div class="settings-row">
      <label>
        Master
        <input id="masterVolume" type="range"
               min="0" max="1" step="0.01" value="0.5">
      </label>

      <label>
        <input id="localSound" type="checkbox" checked>
        Local sound
      </label>

      <button id="usbButton">Connect USB MIDI</button>

      <select id="midiOutput" aria-label="MIDI output">
        <option value="">No USB MIDI output</option>
      </select>
    </div>

    <div class="settings-row">
      <label>
        Lower volume
        <input id="lowerVolume" type="range"
               min="0" max="2" step="0.05" value="1.5">
        <span id="lowerValue">150%</span>
      </label>

      <label>
        Upper volume
        <input id="upperVolume" type="range"
               min="0" max="2" step="0.05" value="1">
        <span id="upperValue">100%</span>
      </label>
    </div>

    <div class="hint">
      Compact V3. Volume changes affect tablet audio only.
      Piano samples require internet access.
    </div>
  </div>

  <div id="status">
    Compact V3 ready. Tap Load piano.
  </div>

  <section class="manual" id="lowerManual">
    <div class="manual-header">
      <div class="manual-title">LOWER</div>
      <label>
        Oct <select class="octave" aria-label="Lower octave"></select>
      </label>
      <label>
        Ch <select class="channel" aria-label="Lower channel"></select>
      </label>
    </div>
    <div class="keyboard"></div>
  </section>

  <section class="manual" id="upperManual">
    <div class="manual-header">
      <div class="manual-title">UPPER</div>
      <label>
        Oct <select class="octave" aria-label="Upper octave"></select>
      </label>
      <label>
        Ch <select class="channel" aria-label="Upper channel"></select>
      </label>
    </div>
    <div class="keyboard"></div>
  </section>

</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

function log(message) {
  $("status").textContent = message;
}

const manuals = [
  {
    root: $("lowerManual"),
    octave: 0,
    channel: 0,
    volume: 1.5,
    bus: null
  },
  {
    root: $("upperManual"),
    octave: 1,
    channel: 1,
    volume: 1,
    bus: null
  }
];

// SETTINGS

$("settingsButton").addEventListener("click", () => {
  const panel = $("settings");
  panel.hidden = !panel.hidden;

  $("settingsButton").textContent =
    panel.hidden ? "Settings" : "Close";

  $("settingsButton").setAttribute(
    "aria-expanded",
    String(!panel.hidden)
  );
});

// LOCAL AUDIO

let audioContext = null;
let masterGain = null;
let compressor = null;
let pianoPlayers = null;
let pianoLoading = false;

function initAudio() {
  if (!audioContext) {
    audioContext = new (
      window.AudioContext || window.webkitAudioContext
    )();

    masterGain = audioContext.createGain();
    masterGain.gain.value = Number($("masterVolume").value);

    compressor = audioContext.createDynamicsCompressor();
    compressor.threshold.value = -10;
    compressor.knee.value = 12;
    compressor.ratio.value = 6;

    masterGain.connect(compressor);
    compressor.connect(audioContext.destination);

    manuals.forEach(manual => {
      manual.bus = audioContext.createGain();
      manual.bus.gain.value = manual.volume;
      manual.bus.connect(masterGain);
    });
  }

  if (audioContext.state === "suspended") {
    audioContext.resume().catch(error => log(error.message));
  }
}

$("masterVolume").addEventListener("input", event => {
  if (masterGain) {
    masterGain.gain.setTargetAtTime(
      Number(event.target.value),
      audioContext.currentTime,
      0.02
    );
  }
});

[
  ["lowerVolume", "lowerValue", 0],
  ["upperVolume", "upperValue", 1]
].forEach(([sliderId, valueId, index]) => {
  $(sliderId).addEventListener("input", event => {
    const volume = Number(event.target.value);

    manuals[index].volume = volume;
    $(valueId).textContent = Math.round(volume * 100) + "%";

    if (manuals[index].bus) {
      manuals[index].bus.gain.setTargetAtTime(
        volume,
        audioContext.currentTime,
        0.02
      );
    }
  });
});

function loadPianoLibrary() {
  if (window.Soundfont) return Promise.resolve();

  return new Promise((resolve, reject) => {
    const script = document.createElement("script");

    script.src =
      "https://cdn.jsdelivr.net/npm/" +
      "soundfont-player@0.12.0/dist/soundfont-player.js";

    script.onload = () => {
      if (window.Soundfont) resolve();
      else reject(new Error("Piano library did not initialize"));
    };

    script.onerror = () => {
      script.remove();
      reject(new Error("Piano library download failed"));
    };

    document.head.appendChild(script);
  });
}

$("pianoButton").addEventListener("click", async () => {
  initAudio();

  if (pianoLoading) return;

  if (pianoPlayers) {
    log("Grand piano ready.");
    return;
  }

  pianoLoading = true;
  $("pianoButton").disabled = true;
  $("pianoButton").textContent = "Loading...";
  log("Downloading piano samples. Synth remains playable.");

  try {
    await loadPianoLibrary();

    const players = await Promise.all(
      manuals.map(manual =>
        Soundfont.instrument(
          audioContext,
          "acoustic_grand_piano",
          {
            soundfont: "MusyngKite",
            format: "mp3",
            destination: manual.bus,
            release: 0.35
          }
        )
      )
    );

    pianoPlayers = players;
    $("pianoButton").textContent = "Piano ready";
    log("Grand piano ready. Volume balance is in Settings.");
  } catch (error) {
    $("pianoButton").textContent = "Retry piano";
    log("Piano failed: " + error.message + ". Synth active.");
  } finally {
    pianoLoading = false;
    $("pianoButton").disabled = false;
  }
});

function createVoice(note, manualIndex) {
  if (!$("localSound").checked) return null;

  initAudio();

  if (pianoPlayers) {
    const voice = pianoPlayers[manualIndex].play(
      note,
      audioContext.currentTime,
      { gain: 0.45 }
    );

    return () => voice.stop();
  }

  // Simple fallback while piano samples are unavailable.
  const osc1 = audioContext.createOscillator();
  const osc2 = audioContext.createOscillator();
  const gain = audioContext.createGain();

  const frequency = 440 * Math.pow(2, (note - 69) / 12);
  const now = audioContext.currentTime;

  osc1.type = "triangle";
  osc2.type = "sine";
  osc1.frequency.value = frequency;
  osc2.frequency.value = frequency * 2;

  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.1, now + 0.02);

  osc1.connect(gain);
  osc2.connect(gain);
  gain.connect(manuals[manualIndex].bus);

  osc1.start(now);
  osc2.start(now);

  return () => {
    const time = audioContext.currentTime;

    gain.gain.cancelScheduledValues(time);
    gain.gain.setTargetAtTime(0, time, 0.06);

    osc1.stop(time + 0.4);
    osc2.stop(time + 0.4);

    osc1.onended = () => {
      osc1.disconnect();
      osc2.disconnect();
      gain.disconnect();
    };
  };
}

// MIDI OUTPUT

let midiAccess = null;
let selectedOutput = null;

const BLE_SERVICE =
  "03b80e5a-ede8-4b33-a751-6ce34ec4c700";

const BLE_CHARACTERISTIC =
  "7772e5db-3868-4112-a1a9-f2669d106bf3";

let bleDevice = null;
let bleCharacteristic = null;
let bleConnecting = false;
let bleQueue = Promise.resolve();

function sendMidi(status, data1, data2) {
  if (selectedOutput) {
    try {
      selectedOutput.send([status, data1, data2]);
    } catch (error) {
      log("USB MIDI: " + error.message);
    }
  }

  const characteristic = bleCharacteristic;
  if (!characteristic) return;

  bleQueue = bleQueue.then(async () => {
    if (characteristic !== bleCharacteristic) return;

    const timestamp =
      Math.floor(performance.now()) & 0x1fff;

    const packet = new Uint8Array([
      0x80 | ((timestamp >> 7) & 0x3f),
      0x80 | (timestamp & 0x7f),
      status,
      data1,
      data2
    ]);

    if (
      characteristic.properties.writeWithoutResponse &&
      characteristic.writeValueWithoutResponse
    ) {
      await characteristic.writeValueWithoutResponse(packet);
    } else if (
      characteristic.properties.write &&
      characteristic.writeValueWithResponse
    ) {
      await characteristic.writeValueWithResponse(packet);
    } else {
      await characteristic.writeValue(packet);
    }
  }).catch(error => {
    log("BLE write: " + error.message);
  });
}

function updatePorts() {
  const previousId = $("midiOutput").value;

  $("midiOutput").replaceChildren(
    new Option("No USB MIDI output", "")
  );

  for (const output of midiAccess.outputs.values()) {
    $("midiOutput").add(
      new Option(output.name || output.id, output.id)
    );
  }

  $("midiOutput").value =
    midiAccess.outputs.has(previousId) ? previousId : "";

  selectedOutput =
    midiAccess.outputs.get($("midiOutput").value) || null;
}

$("usbButton").addEventListener("click", async () => {
  initAudio();

  if (!navigator.requestMIDIAccess) {
    log("Web MIDI unavailable. BLE Connect is separate.");
    return;
  }

  try {
    midiAccess = await navigator.requestMIDIAccess({
      sysex: false
    });

    updatePorts();
    midiAccess.onstatechange = updatePorts;

    log("Select a USB MIDI output in Settings.");
  } catch (error) {
    log("USB MIDI: " + error.message);
  }
});

$("midiOutput").addEventListener("change", () => {
  panic();

  selectedOutput =
    midiAccess?.outputs.get($("midiOutput").value) || null;
});

$("bleButton").addEventListener("click", async () => {
  initAudio();

  if (bleConnecting) return;

  if (bleCharacteristic) {
    panic();
    await bleQueue;

    if (bleDevice?.gatt.connected) {
      bleDevice.gatt.disconnect();
    }
    return;
  }

  if (!window.isSecureContext) {
    log("BLE requires HTTPS or localhost.");
    return;
  }

  if (!navigator.bluetooth) {
    log("Web Bluetooth unavailable. Try Chrome on Android.");
    return;
  }

  bleConnecting = true;

  try {
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [BLE_SERVICE] }],
      optionalServices: [BLE_SERVICE]
    });

    bleDevice.addEventListener(
      "gattserverdisconnected",
      () => {
        bleCharacteristic = null;

        $("bleButton").textContent = "BLE Connect";
        $("bleButton").classList.remove("connected");

        panic();
        log("BLE disconnected.");
      },
      { once: true }
    );

    log("Connecting to " + (bleDevice.name || "BLE MIDI device"));

    const server = await bleDevice.gatt.connect();
    const service = await server.getPrimaryService(BLE_SERVICE);

    const characteristic =
      await service.getCharacteristic(BLE_CHARACTERISTIC);

    if (
      !characteristic.properties.write &&
      !characteristic.properties.writeWithoutResponse
    ) {
      throw new Error("MIDI characteristic is not writable");
    }

    bleCharacteristic = characteristic;

    $("bleButton").textContent = "BLE connected";
    $("bleButton").classList.add("connected");

    log("BLE output connected. Tap BLE connected to disconnect.");
  } catch (error) {
    bleCharacteristic = null;

    if (bleDevice?.gatt.connected) {
      bleDevice.gatt.disconnect();
    }

    log("BLE: " + error.message);
  } finally {
    bleConnecting = false;
  }
});

// NOTE TRACKING

const activeNotes = new Map();
const activePointers = new Map();
const midiCounts = new Map();

function startNote(pointerId, key, manualIndex) {
  const manual = manuals[manualIndex];

  const note =
    48 + 12 * manual.octave + Number(key.dataset.semitone);

  const channel = manual.channel;
  const midiKey = channel + ":" + note;

  const count = midiCounts.get(midiKey) || 0;
  midiCounts.set(midiKey, count + 1);

  if (count === 0) {
    sendMidi(0x90 | channel, note, 100);
  }

  key.dataset.held = Number(key.dataset.held || 0) + 1;
  key.classList.add("active");

  activeNotes.set(pointerId, {
    note,
    channel,
    midiKey,
    key,
    stop: createVoice(note, manualIndex)
  });
}

function stopNote(pointerId) {
  const held = activeNotes.get(pointerId);
  if (!held) return;

  activeNotes.delete(pointerId);

  if (held.stop) held.stop();

  const count = (midiCounts.get(held.midiKey) || 1) - 1;

  if (count > 0) {
    midiCounts.set(held.midiKey, count);
  } else {
    midiCounts.delete(held.midiKey);
    sendMidi(0x80 | held.channel, held.note, 0);
  }

  held.key.dataset.held = Math.max(
    0,
    Number(held.key.dataset.held || 1) - 1
  );

  if (Number(held.key.dataset.held) === 0) {
    held.key.classList.remove("active");
  }
}

function panic() {
  for (const id of [...activeNotes.keys()]) {
    stopNote(id);
  }

  activePointers.clear();

  for (let channel = 0; channel < 16; channel++) {
    sendMidi(0xb0 | channel, 64, 0);
    sendMidi(0xb0 | channel, 123, 0);
  }

  log("All notes released.");
}

$("panicButton").addEventListener("click", panic);

$("localSound").addEventListener("change", () => {
  for (const held of activeNotes.values()) {
    if (held.stop) {
      held.stop();
      held.stop = null;
    }
  }
});

window.addEventListener("blur", panic);

document.addEventListener("visibilitychange", () => {
  if (document.hidden) panic();
});

// BUILD THE TWO KEYBOARDS

const BLACK_NOTES = [1, 3, 6, 8, 10];
const KEY_COUNT = 37;

manuals.forEach((manual, manualIndex) => {
  const keyboard = manual.root.querySelector(".keyboard");
  const octaveSelect = manual.root.querySelector(".octave");
  const channelSelect = manual.root.querySelector(".channel");

  for (let octave = -2; octave <= 2; octave++) {
    octaveSelect.add(new Option(
      octave > 0 ? "+" + octave : String(octave),
      octave
    ));
  }

  octaveSelect.value = manual.octave;

  for (let channel = 0; channel < 16; channel++) {
    channelSelect.add(new Option(channel + 1, channel));
  }

  channelSelect.value = manual.channel;

  let whiteCount = 0;

  for (let semitone = 0; semitone < KEY_COUNT; semitone++) {
    const isBlack = BLACK_NOTES.includes(semitone % 12);
    const key = document.createElement("div");

    key.className =
      "key " + (isBlack ? "black-key" : "white-key");

    key.dataset.semitone = semitone;

    if (!isBlack) {
      whiteCount++;

      const label = document.createElement("span");
      label.className = "key-label";
      key.appendChild(label);
    }

    keyboard.appendChild(key);
  }

  let precedingWhites = 0;

  for (const key of keyboard.children) {
    if (key.classList.contains("white-key")) {
      precedingWhites++;
    } else {
      key.style.left =
        ((precedingWhites - 0.325) * 100 / whiteCount) + "%";

      key.style.width = (65 / whiteCount) + "%";
    }
  }

  function updateLabels() {
    for (const key of keyboard.querySelectorAll(".white-key")) {
      const note =
        48 + 12 * manual.octave +
        Number(key.dataset.semitone);

      key.firstChild.textContent =
        note % 12 === 0
          ? "C" + (Math.floor(note / 12) - 1)
          : "";
    }
  }

  updateLabels();

  octaveSelect.addEventListener("change", () => {
    panic();
    manual.octave = Number(octaveSelect.value);
    updateLabels();
  });

  channelSelect.addEventListener("change", () => {
    panic();
    manual.channel = Number(channelSelect.value);
  });

  // Block browser long-press menus on the piano.
  for (const eventName of [
    "contextmenu",
    "selectstart",
    "dragstart"
  ]) {
    keyboard.addEventListener(eventName, event => {
      event.preventDefault();
    });
  }

  function movePointer(event) {
    const target = document.elementFromPoint(
      event.clientX,
      event.clientY
    )?.closest(".key");

    const key =
      target && keyboard.contains(target) ? target : null;

    if (activePointers.get(event.pointerId) === key) return;

    stopNote(event.pointerId);
    activePointers.set(event.pointerId, key);

    if (key) {
      startNote(event.pointerId, key, manualIndex);
    }
  }

  keyboard.addEventListener("pointerdown", event => {
    event.preventDefault();
    initAudio();

    keyboard.setPointerCapture(event.pointerId);
    activePointers.set(event.pointerId, null);

    movePointer(event);
  }, { passive: false });

  keyboard.addEventListener("pointermove", event => {
    if (!activePointers.has(event.pointerId)) return;

    event.preventDefault();
    movePointer(event);
  }, { passive: false });

  for (const eventName of [
    "pointerup",
    "pointercancel",
    "lostpointercapture"
  ]) {
    keyboard.addEventListener(eventName, event => {
      stopNote(event.pointerId);
      activePointers.delete(event.pointerId);
    });
  }
});
</script>

</body>
</html>
